<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Refer a Friend - Emporium</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; padding: 40px;">
  <h2>📩 Sharing Emporium Recruitment Drive...</h2>
  <p id="status">Preparing your referral message...</p>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const drive = urlParams.get("drive") || "";
    const branchDocname = urlParams.get("branch") || "";

    // Fallback address (in case API fails)
    let branchAddress = branchDocname || "Emporium Branch";

    // First fetch full branch details (same as thank_you.html)
    async function fetchBranchDetails() {
      if (!drive) return;

      try {
        const res = await fetch(
          `/api/method/job_club.job_club.doctype.registration_from.registration_from.get_drive_and_branch_details?drive_name=${encodeURIComponent(drive)}`
        );
        const r = await res.json();
        if (r.message) {
          branchAddress = r.message.address || branchAddress;
        }
      } catch (err) {
        console.error("Error fetching branch:", err);
      }
    }

    // Share flow
    async function shareContent() {
      await fetchBranchDetails();

      const branchParam = urlParams.get("location") || "Emporium Branch"; // use docname/short
      
      // Build registration link
      const shareUrl = `${window.location.origin}/registration-from/new?drive=${encodeURIComponent(drive)}&branch=${encodeURIComponent(branchParam)}`;

      // Build referral message
      const shareMessage = `📢 Hi! Emporium Recruitment Drive at  
📍 Location: ${branchAddress}  
🔗 Hurry Secure Your Seat Online  
${shareUrl}`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: "Emporium Recruitment Drive",
            text: shareMessage,
            url: shareUrl
          });
          document.getElementById("status").innerText = "✅ Shared successfully!";
        } catch (err) {
          console.log("Share cancelled:", err);
          document.getElementById("status").innerText = "❌ Share cancelled.";
        }
      } else {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(shareMessage);
          } else {
            const textarea = document.createElement("textarea");
            textarea.value = shareMessage;
            textarea.style.position = "fixed";
            textarea.style.left = "-9999px";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            document.execCommand("copy");
            textarea.remove();
          }
          document.getElementById("status").innerText =
            "✅ Referral message copied! Paste it into WhatsApp/Telegram/Email.";
        } catch (err) {
          console.error("Copy failed:", err);
          document.getElementById("status").innerText =
            "❌ Could not copy. Please copy manually.";
        }
      }
    }

    // Auto-run on load
    shareContent();
  </script>
</body>
</html>
