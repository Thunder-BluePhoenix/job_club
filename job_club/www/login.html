<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Login | Emporium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(60% 40% at bottom, #4158D0 0%, #000 60%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .logo {
            width: 200px;
            margin-bottom: 24px;
            background: white;
            padding: 10px 10px;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        /* login card */
        .auth-card {
            width: 100%;
            max-width: 390px;
            background: linear-gradient(180deg,
                    rgb(255 255 255 / 7%),
                    rgb(255 255 255 / 4%));

            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 34px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .input-group-box {
            margin-top: 18px;
        }

        /* Title */
        h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .auth-card p {
            font-size: 14px;
            color: #666;
            margin-bottom: 24px;
        }

        /* Inputs */
        .field {
            display: flex;
            gap: 10px;
        }

        .auth-card label {
            font-size: 13px;
            font-weight: 400;
            margin-bottom: 6px;
            display: block;
        }

        .input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .input::placeholder {
            color: #aaa;
        }

        .input:focus {
            border-color: #2E3D92;
            box-shadow: 0 0 0 2px rgba(124, 77, 255, 0.25);
        }

        .input-group {
            margin-bottom: 14px;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
        }

        /* Button */
        .primary-btnn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(90deg, #2E3D92, #D41F26);
            margin-top: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .primary-btnn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 31, 38, 0.45);
        }

        /* Footer */

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #fff;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .auth-card {
                margin: 16px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <img class="logo" src="/assets/job_club/images/logo-es.png" alt="Job Club" />
    </div>
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p>Login to access your workspace</p>
        <div>
            <div class="input-group-box">
                <form method="POST" action="/api/method/login">
                    <div class="input-group">
                        <label>User ID</label>
                        <input type="text" name="usr" class="input" placeholder="Enter your user ID" required />
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <div class="password-container">
                            <input type="password" name="pwd" id="password" class="input"
                                placeholder="Enter your password" required />
                            <i class="fas fa-eye toggle-password" id="eyeIcon"></i>
                        </div>
                    </div>

                    <button type="submit" class="primary-btnn">Login</button>
                </form>
            </div>
        </div>
    </div>
    <div class="footer">
        <div>Powered by <strong>Indware Digital</strong></div>
    </div>
    <script>
        const togglePassword = document.getElementById("eyeIcon");
        const password = document.getElementById("password");

        togglePassword.addEventListener("click", () => {
            const isPassword = password.type === "password";
            password.type = isPassword ? "text" : "password";
            togglePassword.classList.toggle("fa-eye-slash");
        });

        document.querySelector("form").addEventListener("submit", function (e) {
            e.preventDefault();

            const formData = new FormData(this);

            // Call both login and get redirect URL in parallel for faster redirect
            fetch("/api/method/login", {
                method: "POST",
                body: formData,
                credentials: "same-origin"
            })
                .then(res => res.json())
                .then(data => {
                    if (data.message === "Logged In") {
                        // Immediately fetch redirect URL without waiting
                        fetch("/api/method/job_club.api.auth.get_redirect_url", {
                            credentials: "same-origin"
                        })
                            .then(res => res.json())
                            .then(redirectData => {
                                // Redirect immediately
                                window.location.replace(redirectData.message || "/app/admin-dashboard");
                            })
                            .catch(() => {
                                window.location.replace("/app/admin-dashboard");
                            });
                    } else {
                        alert("Invalid username or password");
                    }
                })
                .catch(() => alert("Login failed. Please try again."));
        });
    </script>
</body>

</html>
